<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">50 Seeds — AI 作图热门视觉种子库</title>
  <desc id="desc">暖黑底标题：50 Seeds，51 类 × 50 条 = 2,550 条热门视觉种子；右侧是双词条组合示意，电影分类与灯光方案分类各抽一条，拼成一组提示词灵感。</desc>

  <rect width="1200" height="360" rx="26" fill="#171310"/>

  <g id="dots" fill="#2a211a">
    <circle cx="700" cy="40" r="3"/><circle cx="740" cy="40" r="3"/><circle cx="700" cy="80" r="3"/><circle cx="740" cy="80" r="3"/>
    <circle cx="700" cy="320" r="3"/><circle cx="740" cy="320" r="3"/><circle cx="700" cy="280" r="3"/><circle cx="740" cy="280" r="3"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#c98a6b">AI 作图视觉种子库 · VISUAL SEED LIBRARY</text>
    <text x="56" y="130" font-size="64" font-weight="700" fill="#f5efe8">50 Seeds</text>
    <text x="56" y="170" font-size="23" fill="#ff5a3c">51 类 × 50 条 = 2,550 条热门视觉种子</text>
    <text x="56" y="204" font-size="19" fill="#b8a89a">中英双语，带排名与风格描述，复制即用。</text>
    <g id="chips" font-size="18" fill="#f5efe8" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/><text x="119" y="262">51 个分类</text></g>
      <g><rect x="194" y="238" width="162" height="36" rx="18" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/><text x="275" y="262">2,550 条种子</text></g>
      <g><rect x="368" y="238" width="180" height="36" rx="18" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/><text x="458" y="262">双词条组合摇号</text></g>
      <g><rect x="560" y="238" width="126" height="36" rx="18" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/><text x="623" y="262">中英双语</text></g>
    </g>
  </g>

  <g id="combo-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="800" y="46" font-size="18" fill="#b8a89a">双词条组合 · 各抽一条拼灵感</text>
    <g id="card-a">
      <rect x="800" y="62" width="160" height="96" rx="14" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/>
      <path d="M806 65 h148" stroke="#ff5a3c" stroke-width="6" stroke-linecap="round"/>
      <text x="820" y="104" font-size="22" font-weight="700" fill="#f5efe8">电影</text>
      <text x="820" y="132" font-size="18" fill="#b8a89a">Films · 50</text>
    </g>
    <text x="972" y="122" font-size="30" font-weight="700" fill="#ff5a3c" text-anchor="middle">+</text>
    <g id="card-b">
      <rect x="1000" y="62" width="160" height="96" rx="14" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/>
      <path d="M1006 65 h148" stroke="#ff5a3c" stroke-width="6" stroke-linecap="round"/>
      <text x="1020" y="104" font-size="22" font-weight="700" fill="#f5efe8">灯光方案</text>
      <text x="1020" y="132" font-size="18" fill="#b8a89a">Lighting · 50</text>
    </g>
    <g id="combo-math" text-anchor="middle">
      <text x="980" y="212" font-size="26" font-weight="700" fill="#f5efe8">50 × 50 = <tspan fill="#ff5a3c">2,500</tspan> 种组合</text>
    </g>
    <g id="combo-example">
      <rect x="800" y="238" width="360" height="72" rx="14" fill="#241c16" stroke="#3a2d22" stroke-width="1.5"/>
      <text x="824" y="268" font-size="19" fill="#f5efe8">爱乐之城 <tspan fill="#ff5a3c">+</tspan> 斑驳树影光</text>
      <text x="824" y="294" font-size="18" fill="#b8a89a">La La Land + Dappled Light</text>
    </g>
  </g>
</svg>
